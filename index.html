{c:4,n:481,q:"Qu'est-ce que la trêve hivernale ?",a:"La période du 1er novembre au 31 mars pendant laquelle un locataire ne peut pas être expulsé de son logement."},
{c:4,n:482,q:"Qui paie les petites réparations dans un logement loué ?",a:"Le locataire, pour l'entretien courant ; les grosses réparations sont à la charge du propriétaire."},
{c:4,n:483,q:"Quel numéro appeler pour les femmes victimes de violences ?",a:"Le 3919, gratuit et anonyme."},
{c:4,n:484,q:"Quel numéro d'urgence permet aux personnes sourdes ou malentendantes de contacter les secours par SMS ?",a:"Le 114."},
{c:4,n:485,q:"Qu'est-ce que la complémentaire santé solidaire ?",a:"Une aide qui permet aux personnes à faibles revenus d'avoir une complémentaire santé gratuite ou à faible coût."},
{c:4,n:486,q:"La vaccination des jeunes enfants est-elle obligatoire en France ?",a:"Oui, plusieurs vaccins sont obligatoires (diphtérie, tétanos, poliomyélite, rougeole…) ; ils sont exigés pour l'entrée en collectivité (crèche, école)."},
{c:4,n:487,q:"Qu'est-ce que l'aide médicale de l'État (AME) ?",a:"Une aide qui permet aux étrangers en situation irrégulière, sous conditions de ressources et de résidence, d'accéder aux soins."},
{c:4,n:488,q:"Qu'est-ce qu'une crèche ?",a:"Un lieu d'accueil collectif pour les enfants de moins de 3 ans."},
{c:4,n:489,q:"Qu'est-ce qu'une assistante maternelle ?",a:"Une professionnelle agréée qui garde de jeunes enfants à son domicile."},
{c:4,n:490,q:"Le lycée est-il obligatoire ?",a:"Non, mais les jeunes de 16 à 18 ans ont une obligation de formation (études, apprentissage, emploi ou service civique)."},
{c:4,n:491,q:"Quel diplôme marque la fin des études au lycée ?",a:"Le baccalauréat."},
{c:4,n:492,q:"Quel diplôme passe-t-on à la fin du collège ?",a:"Le diplôme national du brevet (DNB)."},
{c:4,n:493,q:"Qu'est-ce que l'apprentissage ?",a:"Une formation en alternance entre un centre de formation et une entreprise, avec un contrat de travail et un salaire."},
{c:4,n:494,q:"Qu'est-ce que le service civique ?",a:"Un engagement volontaire de 6 à 12 mois pour une mission d'intérêt général, ouvert aux 16-25 ans (jusqu'à 30 ans pour les personnes en situation de handicap)."},
{c:4,n:495,q:"Qu'est-ce que la taxe foncière ?",a:"Un impôt local payé chaque année par les propriétaires d'un bien immobilier."},
{c:4,n:496,q:"Qu'est-ce que le prélèvement à la source ?",a:"Depuis 2019, l'impôt sur le revenu est prélevé directement chaque mois sur le salaire ou la pension."},
{c:4,n:497,q:"Faire du bruit la nuit chez soi au point de gêner ses voisins est :",a:"Interdit : le tapage nocturne est puni d'une amende."},
{c:4,n:498,q:"Que faut-il faire avant de construire ou d'agrandir une maison ?",a:"Demander une autorisation d'urbanisme à la mairie (permis de construire ou déclaration préalable)."},
{c:4,n:499,q:"Qu'est-ce qu'une association « loi 1901 » ?",a:"Un groupement d'au moins deux personnes qui mettent en commun leurs activités dans un but autre que le partage des bénéfices."},
{c:4,n:500,q:"Où peut-on obtenir gratuitement des informations juridiques ?",a:"Dans un point-justice ou une maison de justice et du droit, où des professionnels du droit donnent des consultations gratuites."},
{c:4,n:501,q:"Qu'est-ce qu'un espace France Services ?",a:"Un guichet de proximité qui aide les usagers dans leurs démarches administratives (impôts, CAF, retraite, santé…)."},
{c:4,n:502,q:"Comment signaler un changement d'adresse à plusieurs organismes à la fois ?",a:"En ligne, sur service-public.fr, qui prévient en une seule fois plusieurs organismes (CAF, impôts, Assurance maladie…)."},
{c:4,n:503,q:"Qu'est-ce qu'un titre de séjour ?",a:"Un document délivré par la préfecture qui autorise un étranger non européen à séjourner en France."},
{c:4,n:504,q:"Qu'est-ce que le contrat d'intégration républicaine (CIR) ?",a:"Un contrat signé par les étrangers nouvellement arrivés pour s'installer durablement, qui comprend une formation civique et, si besoin, des cours de français."},
{c:4,n:505,q:"Quel organisme est chargé du contrat d'intégration républicaine ?",a:"L'OFII (Office français de l'immigration et de l'intégration)."},
{c:4,n:506,q:"Abandonner un animal domestique est :",a:"Un délit puni par la loi."},
{c:4,n:507,q:"Fumer dans une voiture en présence d'un enfant mineur est :",a:"Interdit et puni d'une amende."},
{c:4,n:508,q:"Quelle est la durée du congé maternité pour un premier ou un deuxième enfant ?",a:"16 semaines (6 avant et 10 après la naissance, en principe)."}

/* ---------- état ---------- */
const CLE = "civique:progression";
let etats = {};          // { numéro: "su" | "revoir" }
let rubrique = -1;       // -1 = toutes
let deck = [];
let pos = 0;
let ouvert = false;
let mode = "fiche";       // "fiche" | "qcm" | "examen"
let options = null;       // propositions mélangées de la carte affichée
let carteRendue = null;   // numéro de la carte pour laquelle options a été tiré
let choix = null;         // index choisi dans options
let serie = {justes:0, total:0};

/* ---------- examen blanc ---------- */
const EXAMEN_N = 40;
const EXAMEN_DUREE = 45*60; // secondes
const EXAMEN_SEUIL = 32;
let examen = null; // {items:[{f,options,choix}], restant, minuteurId, termine, score}

const $ = id => document.getElementById(id);

async function charger(){
  try{
    const r = await window.storage.get(CLE);
    if(r && r.value) etats = JSON.parse(r.value);
  }catch(e){ etats = {}; }
}
async function sauver(){
  try{ await window.storage.set(CLE, JSON.stringify(etats)); }catch(e){}
}

/* ---------- constitution du paquet ---------- */
function melanger(t){
  for(let i=t.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[t[i],t[j]]=[t[j],t[i]];}
  return t;
}
function construire(garder){
  const nActuel = garder && deck[pos] !== undefined ? FICHES[deck[pos]].n : null;
  const seulRevoir = $("f-revoir").checked;
  const seulNeuves = $("f-neuves").checked;
  deck = [];
  FICHES.forEach((f,i)=>{
    if(rubrique !== -1 && f.c !== rubrique) return;
    const e = etats[f.n];
    if(seulRevoir && e !== "revoir") return;
    if(seulNeuves && e) return;
    deck.push(i);
  });
  if($("f-melange").checked) melanger(deck);
  const retrouve = nActuel === null ? -1 : deck.findIndex(i => FICHES[i].n === nActuel);
  pos = retrouve >= 0 ? retrouve : Math.min(pos, Math.max(deck.length-1,0));
  reinitCarte();
  dessiner();
}

/* ---------- rendu ---------- */
function dessinerModes(){
  const hote = $("modes");
  hote.innerHTML = "";
  [
    ["Fiches à retourner","fiche"],
    ["Questions à choix multiples","qcm"],
    ["Examen blanc (40 questions · 45 min)","examen"]
  ].forEach(([t,v])=>{
    const b = document.createElement("button");
    b.innerHTML = '<span>'+t+'</span>';
    b.setAttribute("aria-pressed", v === mode);
    b.onclick = ()=>choisirMode(v);
    hote.appendChild(b);
  });
}
function choisirMode(v){
  arreterMinuteur();
  if(v === "examen"){ demarrerExamen(); return; }
  mode = v; serie = {justes:0,total:0}; reinitCarte(); dessinerModes(); dessiner();
}
function reinitCarte(){ ouvert = false; choix = null; options = null; carteRendue = null; }

function dessinerRubriques(){
  const hote = $("rubriques");
  hote.innerHTML = "";
  const lignes = [{t:"Toutes les questions", v:-1, n:FICHES.length}]
    .concat(RUBRIQUES.map((t,i)=>({t, v:i, n:FICHES.filter(f=>f.c===i).length})));
  lignes.forEach(l=>{
    const b = document.createElement("button");
    b.innerHTML = '<span>'+l.t+'</span><span class="n">'+l.n+'</span>';
    b.setAttribute("aria-pressed", l.v === rubrique);
    b.onclick = ()=>{ rubrique = l.v; pos = 0; dessinerRubriques(); construire(false); };
    hote.appendChild(b);
  });
}

function dessiner(){
  const fiche = $("fiche"), actions = $("actions");
  const total = FICHES.length;
  const acquis = FICHES.filter(f=>etats[f.n]==="su").length;
  const aRevoir = FICHES.filter(f=>etats[f.n]==="revoir").length;

  $("jauge").style.width = (acquis/total*100)+"%";
  $("compte").innerHTML = "<b>"+acquis+"</b> / "+total+" acquises<br>"+aRevoir+" à revoir · "+(total-acquis-aRevoir)+" jamais vues";

  if(mode === "examen"){ dessinerExamen(); return; }

  if(deck.length === 0){
    $("rubrique-en-cours").textContent = "";
    $("position").textContent = "";
    fiche.innerHTML = '<p class="vide">Aucune question ne correspond à cette sélection. Décochez un filtre ou choisissez une autre rubrique.</p>';
    actions.innerHTML = "";
    $("prec").disabled = $("suiv").disabled = true;
    return;
  }
  $("prec").disabled = $("suiv").disabled = false;

  const f = FICHES[deck[pos]];
  const e = etats[f.n];
  $("rubrique-en-cours").textContent = RUBRIQUES[f.c] +
    (mode === "qcm" && serie.total ? "  ·  " + serie.justes + " sur " + serie.total + " justes" : "");
  $("position").textContent = (pos+1)+" sur "+deck.length;
  $("aide").innerHTML = mode === "qcm"
    ? '<kbd>1</kbd>–<kbd>4</kbd> répondre · <kbd>espace</kbd> suivante'
    : '<kbd>espace</kbd> révéler · <kbd>1</kbd> à revoir · <kbd>2</kbd> je savais';

  const badge = e === "su" ? '<span class="etat su">acquise</span>'
              : e === "revoir" ? '<span class="etat revoir">à revoir</span>' : '<span></span>';
  fiche.innerHTML =
    '<div class="num"><span>Question '+f.n+'</span>'+badge+'</div>'+
    '<p class="question">'+f.q+'</p>'+
    (ouvert && mode === "fiche" ? '<div class="reponse apparait">'+f.a+'</div>' : '');

  actions.innerHTML = "";

  if(mode === "qcm"){
    if(carteRendue !== f.n){ options = tirerOptions(f); carteRendue = f.n; choix = null; }
    const liste = document.createElement("div");
    liste.className = "propositions";
    options.forEach((o,i)=>{
      const b = document.createElement("button");
      b.className = "prop";
      b.innerHTML = '<span class="lettre">'+"ABCD"[i]+'</span><span>'+o.t+'</span>';
      if(choix !== null){
        b.disabled = true;
        if(o.juste) b.classList.add("juste");
        else if(i === choix) b.classList.add("faux");
      }else{
        b.onclick = ()=>repondre(i);
      }
      liste.appendChild(b);
    });
    fiche.appendChild(liste);
    if(choix !== null){
      const juste = options[choix].juste;
      const v = document.createElement("p");
      v.className = "verdict " + (juste ? "ok" : "ko");
      v.textContent = juste ? "Bonne réponse." : "Réponse incorrecte.";
      fiche.appendChild(v);
      const r = document.createElement("div");
      r.className = "reponse apparait";
      r.textContent = f.a;
      fiche.appendChild(r);
      actions.appendChild(bouton("Question suivante","btn principal",()=>aller(1)));
    }
    return;
  }

  if(!ouvert){
    actions.appendChild(bouton("Afficher la réponse","btn principal",()=>{ouvert=true;dessiner();}));
  }else{
    actions.appendChild(bouton("À revoir","btn revoir",()=>noter("revoir")));
    actions.appendChild(bouton("Je savais","btn su",()=>noter("su")));
  }
}

function tirerOptions(f){
  const q = QCM[f.n];
  const t = [{t:q.v,juste:true}].concat(q.d.map(x=>({t:x,juste:false})));
  return melanger(t);
}
function repondre(i){
  if(choix !== null) return;
  choix = i;
  const f = FICHES[deck[pos]];
  const juste = options[i].juste;
  serie.total++; if(juste) serie.justes++;
  etats[f.n] = juste ? "su" : "revoir";
  sauver();
  dessiner();
}
function bouton(txt,cls,fn){
  const b=document.createElement("button"); b.className=cls; b.textContent=txt; b.onclick=fn; return b;
}

function noter(v){
  if(deck.length===0) return;
  const f = FICHES[deck[pos]];
  etats[f.n] = v;
  sauver();
  const filtre = $("f-revoir").checked || $("f-neuves").checked;
  if(filtre){
    deck.splice(pos,1);
    if(pos >= deck.length) pos = 0;
    reinitCarte();
    dessiner();
  }else{
    aller(1);
  }
}
function aller(d){
  if(mode === "examen"){
    if(!examen || examen.items.length === 0) return;
    pos = (pos + d + examen.items.length) % examen.items.length;
    dessiner();
    return;
  }
  if(deck.length===0) return;
  pos = (pos + d + deck.length) % deck.length;
  reinitCarte();
  dessiner();
}

/* ---------- examen blanc ---------- */
function demarrerExamen(){
  const admissibles = FICHES.filter(f => QCM[f.n]);
  const tirage = melanger(admissibles.slice()).slice(0, EXAMEN_N);
  examen = {
    items: tirage.map(f => ({ f, options: tirerOptions(f), choix: null })),
    restant: EXAMEN_DUREE,
    minuteurId: null,
    termine: false,
    score: null
  };
  mode = "examen";
  pos = 0;
  dessinerModes();
  demarrerMinuteur();
  dessiner();
}
function demarrerMinuteur(){
  arreterMinuteur();
  examen.minuteurId = setInterval(()=>{
    examen.restant--;
    if(examen.restant <= 0){ examen.restant = 0; terminerExamen(); return; }
    if(mode === "examen" && !examen.termine){
      $("minuteur").textContent = formatTemps(examen.restant);
      $("minuteur").classList.toggle("alerte", examen.restant <= 60);
    }
  }, 1000);
}
function arreterMinuteur(){
  if(examen && examen.minuteurId){ clearInterval(examen.minuteurId); examen.minuteurId = null; }
}
function formatTemps(s){
  const m = Math.floor(s/60), sec = s%60;
  return m+":"+String(sec).padStart(2,"0");
}
function terminerExamen(){
  if(!examen || examen.termine) return;
  arreterMinuteur();
  examen.termine = true;
  examen.score = examen.items.filter(it => it.choix !== null && it.options[it.choix].juste).length;
  dessiner();
}
function dessinerExamen(){
  if(!examen){ demarrerExamen(); return; }
  if(examen.termine){ dessinerResultatExamen(); return; }

  const fiche = $("fiche"), actions = $("actions");
  const it = examen.items[pos];

  $("rubrique-en-cours").textContent = "Examen blanc";
  $("position").textContent = (pos+1)+" sur "+examen.items.length;
  $("minuteur").textContent = formatTemps(examen.restant);
  $("minuteur").classList.toggle("alerte", examen.restant <= 60);
  $("aide").innerHTML = '<kbd>1</kbd>–<kbd>4</kbd> répondre · <kbd>←</kbd><kbd>→</kbd> naviguer';
  $("prec").disabled = $("suiv").disabled = false;

  fiche.innerHTML =
    '<div class="num"><span>Question '+(pos+1)+' / '+examen.items.length+'</span></div>'+
    '<p class="question">'+it.f.q+'</p>';

  const liste = document.createElement("div");
  liste.className = "propositions";
  it.options.forEach((o,i)=>{
    const b = document.createElement("button");
    b.className = "prop" + (it.choix === i ? " choisi" : "");
    b.innerHTML = '<span class="lettre">'+"ABCD"[i]+'</span><span>'+o.t+'</span>';
    b.onclick = ()=>{ it.choix = i; dessiner(); };
    liste.appendChild(b);
  });
  fiche.appendChild(liste);

  actions.innerHTML = "";
  actions.appendChild(bouton("Terminer l'examen","btn principal",()=>terminerExamen()));
}
function dessinerResultatExamen(){
  const fiche = $("fiche"), actions = $("actions");
  const total = examen.items.length;
  const score = examen.score;
  const reussi = score >= EXAMEN_SEUIL;

  $("rubrique-en-cours").textContent = "Examen blanc · résultat";
  $("position").textContent = "";
  $("minuteur").textContent = "";
  $("aide").innerHTML = "";
  $("prec").disabled = $("suiv").disabled = true;

  fiche.innerHTML =
    '<div class="num"><span>Résultat de l\'examen blanc</span></div>'+
    '<p class="question">'+score+' / '+total+' bonnes réponses</p>'+
    '<div class="reponse apparait"><strong class="verdict '+(reussi ? "ok" : "ko")+'">'+
      (reussi
        ? "Admis — le seuil de "+EXAMEN_SEUIL+"/"+total+" est atteint."
        : "Non admis — il fallait au moins "+EXAMEN_SEUIL+"/"+total+" bonnes réponses.") +
    '</strong></div>';

  actions.innerHTML = "";
  actions.appendChild(bouton("Repasser un examen blanc","btn principal",()=>demarrerExamen()));
  actions.appendChild(bouton("Revenir aux fiches","btn plat",()=>choisirMode("fiche")));
}

/* ---------- recherche ---------- */
function chercher(){
  const t = $("q").value.trim().toLowerCase();
  const res = $("res");
  res.innerHTML = "";
  if(t.length < 2) return;
  const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const cible = norm(t);
  FICHES.filter(f => norm(f.q).includes(cible) || norm(f.a).includes(cible))
        .slice(0,10)
        .forEach(f=>{
          const b=document.createElement("button");
          b.innerHTML='<span class="r-num">'+f.n+'</span>'+f.q;
          b.onclick=()=>{
            rubrique = -1;
            $("f-revoir").checked = $("f-neuves").checked = false;
            dessinerRubriques();
            reinitCarte();
            construire(false);
            const i = deck.findIndex(k => FICHES[k].n === f.n);
            if(i>=0){ pos = i; ouvert = true; dessiner(); }
            $("q").value=""; res.innerHTML="";
          };
          res.appendChild(b);
        });
}

/* ---------- branchements ---------- */
$("prec").onclick = ()=>aller(-1);
$("suiv").onclick = ()=>aller(1);
["f-revoir","f-neuves","f-melange"].forEach(id => $(id).onchange = ()=>{ pos=0; construire(false); });
$("q").oninput = chercher;
$("q").onblur = ()=> setTimeout(()=>{$("res").innerHTML="";}, 180);
$("raz").onclick = ()=>{
  etats = {}; sauver(); construire(true);
};

document.addEventListener("keydown", ev=>{
  if(ev.target.tagName === "INPUT") return;
  if(ev.key === "ArrowRight"){ aller(1); return; }
  if(ev.key === "ArrowLeft"){ aller(-1); return; }
  if(mode === "qcm"){
    if("1234".includes(ev.key) && choix === null && options) repondre(Number(ev.key)-1);
    else if((ev.key === " " || ev.key === "Enter") && choix !== null){ ev.preventDefault(); aller(1); }
    return;
  }
  if(mode === "examen"){
    if(examen && !examen.termine && "1234".includes(ev.key)){
      examen.items[pos].choix = Number(ev.key)-1;
      dessiner();
    }
    return;
  }
  if(ev.key === " " || ev.key === "Enter"){ ev.preventDefault(); if(!ouvert){ouvert=true;dessiner();} }
  else if(ev.key === "1" && ouvert) noter("revoir");
  else if(ev.key === "2" && ouvert) noter("su");
});

/* ---------- démarrage ---------- */
(async function(){
  await charger();
  dessinerModes();
  dessinerRubriques();
  construire(false);
})();
</script>
