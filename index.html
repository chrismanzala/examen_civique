<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision — Examen civique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --encre:#131C33;
    --papier:#EDEFF3;
    --carte:#FFFFFF;
    --bleu:#1F4E9C;
    --bleu-pale:#E4EBF7;
    --rouge:#9E2B25;
    --rouge-pale:#F6E7E5;
    --gris:#69718A;
    --trait:#D3D8E2;
    --serif:"Spectral",Georgia,"Times New Roman",serif;
    --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--papier);
    color:var(--encre);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}

  /* ---- en-tête ---- */
  header{
    border-bottom:1px solid var(--trait);
    background:var(--carte);
    position:sticky;top:0;z-index:20;
  }
  .bandeau{
    max-width:1080px;margin:0 auto;padding:14px 22px;
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  }
  .titre{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.1px}
  .sous{font-size:13px;color:var(--gris)}
  .jauge{height:3px;background:var(--trait)}
  .jauge span{display:block;height:100%;background:var(--bleu);width:0;transition:width .35s ease}

  /* ---- grille ---- */
  .grille{
    max-width:1080px;margin:0 auto;padding:26px 22px 60px;
    display:grid;grid-template-columns:216px 1fr;gap:34px;align-items:start;
  }

  /* ---- rail ---- */
  .rail{position:sticky;top:74px;display:flex;flex-direction:column;gap:22px}
  .rubrique{display:flex;flex-direction:column;gap:1px}
  .rubrique button{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    background:none;border:0;border-left:2px solid transparent;
    padding:7px 10px;text-align:left;font-size:13.5px;color:var(--gris);
    border-radius:0 3px 3px 0;
  }
  .rubrique button:hover{background:var(--carte);color:var(--encre)}
  .rubrique button[aria-pressed="true"]{
    background:var(--carte);border-left-color:var(--bleu);
    color:var(--encre);font-weight:500;
  }
  .rubrique .n{font-size:11.5px;color:var(--gris);font-variant-numeric:tabular-nums}
  .bloc-titre{font-size:11.5px;color:var(--gris);padding:0 10px 6px;letter-spacing:.02em}
  .filtres{display:flex;flex-direction:column;gap:6px;padding:0 10px}
  .filtres label{font-size:13px;display:flex;gap:8px;align-items:center;color:var(--encre)}
  .filtres input{accent-color:var(--bleu);width:15px;height:15px}
  .compte{padding:0 10px;font-size:13px;line-height:1.7;color:var(--gris)}
  .compte b{font-family:var(--serif);font-size:17px;color:var(--encre);font-weight:600}
  .lien{background:none;border:0;padding:0 10px;font-size:12.5px;color:var(--gris);text-align:left;text-decoration:underline;text-underline-offset:3px}
  .lien:hover{color:var(--rouge)}
  .note{padding:12px 10px 0;border-top:1px solid var(--trait);font-size:12.5px;color:var(--gris);line-height:1.6}

  /* ---- fiche ---- */
  .scene{display:flex;flex-direction:column;gap:16px;min-width:0}
  .reperes{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--gris)}
  .reperes .pos{font-variant-numeric:tabular-nums}
  .fiche{
    background:var(--carte);border:1px solid var(--trait);border-radius:4px;
    padding:34px 36px;min-height:290px;display:flex;flex-direction:column;
  }
  .num{
    font-size:12.5px;color:var(--gris);font-variant-numeric:tabular-nums;
    padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--trait);
    display:flex;justify-content:space-between;gap:12px;
  }
  .etat{font-size:12px;padding:1px 8px;border-radius:20px}
  .etat.su{background:var(--bleu-pale);color:var(--bleu)}
  .etat.revoir{background:var(--rouge-pale);color:var(--rouge)}
  .question{
    font-family:var(--serif);font-size:25px;line-height:1.4;font-weight:400;
    margin:0;max-width:34em;
  }
  .reponse{
    margin-top:24px;padding-top:22px;border-top:1px dashed var(--trait);
    font-family:var(--serif);font-size:18.5px;line-height:1.65;color:#243252;
    max-width:38em;
  }
  .reponse[hidden]{display:none}
  .apparait{animation:ouvre .22s ease-out}
  @keyframes ouvre{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.apparait{animation:none}.jauge span{transition:none}}

  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{
    border:1px solid var(--trait);background:var(--carte);color:var(--encre);
    padding:11px 18px;border-radius:3px;font-size:14px;font-weight:500;
  }
  .btn:hover{border-color:var(--gris)}
  .btn.principal{background:var(--encre);border-color:var(--encre);color:#fff;flex:1;min-width:190px}
  .btn.principal:hover{background:#20304F}
  .btn.su{color:var(--bleu);border-color:#B9CCE9;flex:1}
  .btn.su:hover{background:var(--bleu-pale)}
  .btn.revoir{color:var(--rouge);border-color:#E2C2BF;flex:1}
  .btn.revoir:hover{background:var(--rouge-pale)}
  .nav{display:flex;gap:10px;justify-content:space-between;align-items:center}
  .nav-g{display:flex;gap:6px}
  .btn.plat{padding:8px 12px;font-size:13px;color:var(--gris);border-color:transparent;background:none}
  .btn.plat:hover{background:var(--carte);border-color:var(--trait)}
  .aide{font-size:12.5px;color:var(--gris)}
  kbd{
    font-family:var(--sans);font-size:11.5px;border:1px solid var(--trait);
    background:var(--carte);border-radius:3px;padding:1px 5px;color:var(--encre);
  }

  /* ---- recherche ---- */
  .cherche{position:relative}
  .cherche input{
    width:100%;padding:9px 12px;font-size:13.5px;border:1px solid var(--trait);
    border-radius:3px;background:var(--carte);color:var(--encre);font-family:var(--sans);
  }
  .resultats{
    position:absolute;z-index:15;top:calc(100% + 4px);left:0;right:0;max-height:300px;overflow:auto;
    background:var(--carte);border:1px solid var(--trait);border-radius:3px;
    box-shadow:0 8px 24px rgba(19,28,51,.10);
  }
  .resultats:empty{display:none}
  .resultats button{
    display:block;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--trait);padding:9px 12px;font-size:13px;line-height:1.45;color:var(--encre);
  }
  .resultats button:last-child{border-bottom:0}
  .resultats button:hover{background:var(--papier)}
  .resultats .r-num{color:var(--gris);font-variant-numeric:tabular-nums;margin-right:7px}

  .propositions{display:flex;flex-direction:column;gap:8px;margin-top:26px}
  .prop{
    display:flex;gap:12px;align-items:baseline;text-align:left;
    background:var(--carte);border:1px solid var(--trait);border-radius:3px;
    padding:13px 16px;font-family:var(--serif);font-size:17px;line-height:1.45;color:var(--encre);
  }
  .prop:hover:not(:disabled){border-color:var(--gris);background:#FAFBFD}
  .prop .lettre{font-family:var(--sans);font-size:12px;color:var(--gris);flex:0 0 12px}
  .prop:disabled{cursor:default}
  .prop.juste{border-color:var(--bleu);background:var(--bleu-pale)}
  .prop.juste .lettre{color:var(--bleu)}
  .prop.faux{border-color:#E2C2BF;background:var(--rouge-pale);color:var(--rouge)}
  .prop.faux .lettre{color:var(--rouge)}
  .verdict{font-family:var(--sans);font-size:13px;margin-top:20px;font-weight:500}
  .verdict.ok{color:var(--bleu)}
  .verdict.ko{color:var(--rouge)}
  .vide{font-family:var(--serif);font-size:19px;color:var(--gris);line-height:1.6;margin:0}

  @media (max-width:840px){
    .grille{grid-template-columns:1fr;gap:20px;padding:18px 16px 48px}
    .rail{position:static;order:2;border-top:1px solid var(--trait);padding-top:20px}
    .scene{order:1}
    .fiche{padding:24px 22px;min-height:0}
    .question{font-size:21px}
    .reponse{font-size:17px}
    .aide{display:none}
    .btn.principal{min-width:0}
  }
</style>

<header>
  <div class="bandeau">
    <span class="titre">Examen civique</span>
    <span class="sous">Naturalisation française · 258 questions</span>
  </div>
  <div class="jauge"><span id="jauge"></span></div>
</header>

<main class="grille">
  <aside class="rail">
    <div class="cherche">
      <input id="q" type="search" placeholder="Chercher une question" autocomplete="off" aria-label="Chercher une question">
      <div class="resultats" id="res"></div>
    </div>

    <div>
      <div class="bloc-titre">Mode</div>
      <div class="rubrique" id="modes"></div>
    </div>

    <div>
      <div class="bloc-titre">Rubriques</div>
      <div class="rubrique" id="rubriques"></div>
    </div>

    <div>
      <div class="bloc-titre">Sélection</div>
      <div class="filtres">
        <label><input type="checkbox" id="f-revoir"> Seulement à revoir</label>
        <label><input type="checkbox" id="f-neuves"> Seulement jamais vues</label>
        <label><input type="checkbox" id="f-melange"> Ordre aléatoire</label>
      </div>
    </div>

    <div>
      <div class="bloc-titre">Progression</div>
      <p class="compte" id="compte"></p>
      <button class="lien" id="raz">Effacer ma progression</button>
    </div>

    <p class="note">À retenir aussi : l'Assemblée nationale compte 577 députés, le Sénat 348 sénateurs.</p>
  </aside>

  <section class="scene">
    <div class="reperes">
      <span id="rubrique-en-cours"></span>
      <span class="pos" id="position"></span>
    </div>

    <article class="fiche" id="fiche"></article>

    <div class="actions" id="actions"></div>

    <div class="nav">
      <div class="nav-g">
        <button class="btn plat" id="prec">← Précédente</button>
        <button class="btn plat" id="suiv">Suivante →</button>
      </div>
      <span class="aide" id="aide"></span>
    </div>
  </section>
</main>

<script>
const RUBRIQUES = [
  "Principes et valeurs",
  "Institutions et politique",
  "Droits et devoirs",
  "Histoire, géographie, culture",
  "Vivre en société"
];

const FICHES = [
{c:0,n:1,q:"Complétez les paroles de la Marseillaise « Allons enfants de la patrie… »",a:"« …le jour de gloire est arrivé ! »"},
{c:0,n:2,q:"Dans le cadre d'un entretien d'embauche, que peut-on demander au candidat ?",a:"Ses compétences professionnelles et son expérience. Il est interdit de poser des questions sur la religion, l'origine, la situation familiale ou les opinions politiques."},
{c:0,n:3,q:"Déclarer ses revenus aux services fiscaux est :",a:"Obligatoire pour toute personne résidant en France."},
{c:0,n:4,q:"En France, les impôts permettent de financer les dépenses publiques. Quelle proposition est correcte ?",a:"Les impôts financent les services publics (hôpitaux, écoles, routes, police, etc.)."},
{c:0,n:5,q:"La liberté d'association est :",a:"Un droit fondamental qui permet à toute personne de créer ou rejoindre une association."},
{c:0,n:6,q:"La liberté d'expression sur les réseaux sociaux en France est :",a:"Garantie mais encadrée par la loi (interdiction de l'incitation à la haine, de la diffamation, etc.)."},
{c:0,n:7,q:"Lequel de ces prénoms évoque un symbole de la République ?",a:"Marianne."},
{c:0,n:8,q:"Lequel de ces symboles représente la République française ?",a:"Marianne (la figure allégorique de la République)."},
{c:0,n:9,q:"Où peut-on voir la devise de la République ?",a:"Sur les bâtiments publics (mairies, écoles, tribunaux…)."},
{c:0,n:10,q:"Lesquels sont des symboles officiels de la République française ?",a:"Le drapeau tricolore (bleu, blanc, rouge), Marianne, la Marseillaise, la devise « Liberté, Égalité, Fraternité » et le coq."},
{c:0,n:11,q:"Peut-on brûler publiquement un drapeau français ?",a:"Non, c'est un délit passible d'une amende."},
{c:0,n:12,q:"Quand la sécurité sociale a-t-elle été établie en France ?",a:"En 1945."},
{c:0,n:13,q:"Que commémore la fête nationale ?",a:"La prise de la Bastille le 14 juillet 1789 et la Fête de la Fédération du 14 juillet 1790."},
{c:0,n:14,q:"Que porte Marianne sur la tête ?",a:"Le bonnet phrygien (symbole de liberté)."},
{c:0,n:15,q:"Que signifie le mot « fraternité » dans la devise française ?",a:"La solidarité entre les citoyens, le sentiment d'entraide et de vivre ensemble."},
{c:0,n:16,q:"Quel symbole de la République peut-on voir sur les maillots de l'équipe de France de football ?",a:"Le coq (le coq gaulois)."},
{c:0,n:17,q:"Quelle est la devise de la République française ?",a:"« Liberté, Égalité, Fraternité »."},
{c:0,n:18,q:"Qu'est-ce que la liberté d'association ?",a:"Le droit de créer, d'adhérer ou de quitter librement une association, sans autorisation préalable."},
{c:0,n:19,q:"Qu'est-ce qu'une liberté ?",a:"Le droit de faire tout ce qui ne nuit pas à autrui, dans le cadre fixé par la loi."},
{c:0,n:20,q:"Selon la Constitution, la France est une République…",a:"…indivisible, laïque, démocratique et sociale."},
{c:0,n:21,q:"Sur quel document peut-on voir Marianne ?",a:"Sur les timbres-poste et les pièces de monnaie."},
{c:0,n:22,q:"Une des valeurs de la devise républicaine est l'Égalité. Qu'est-ce que cela signifie ?",a:"Tous les citoyens ont les mêmes droits et les mêmes devoirs, sans distinction d'origine, de race ou de religion."},
{c:0,n:23,q:"Une personne peut-elle changer librement de religion en France ?",a:"Oui, la liberté de conscience et de culte est garantie par la loi."},
{c:0,n:24,q:"Selon le principe de laïcité, que signifie la neutralité de l'État ?",a:"L'État ne favorise ni ne défavorise aucune religion. Il traite tous les citoyens de manière égale, quelle que soit leur croyance."},
{c:0,n:25,q:"Que peut faire un usager du service public dans une mairie ?",a:"Obtenir des documents administratifs (carte d'identité, passeport, actes d'état civil, inscription sur les listes électorales, etc.)."},
{c:0,n:26,q:"En France, il est possible pour l'État de financer :",a:"Des services publics (éducation, santé, infrastructures), mais pas les cultes religieux (loi de 1905)."},
{c:0,n:27,q:"En quelle année la loi de séparation des Églises et de l'État a-t-elle été votée ?",a:"En 1905."},
{c:0,n:28,q:"Que dit la loi de 1905 ?",a:"La République assure la liberté de conscience et garantit le libre exercice des cultes. Elle ne reconnaît, ne salarie ni ne subventionne aucun culte."},
{c:0,n:29,q:"Que garantit le principe de laïcité ?",a:"La liberté de conscience, la liberté de culte et la neutralité de l'État vis-à-vis des religions."},
{c:0,n:30,q:"Quel jour célèbre-t-on officiellement la laïcité en France ?",a:"Le 9 décembre (date anniversaire de la loi de 1905)."},
{c:0,n:31,q:"Quel symbole religieux peut être porté dans une école publique dans le respect de la laïcité ?",a:"Aucun signe religieux ostensible. Seuls les signes discrets sont tolérés."},
{c:0,n:32,q:"Quel terme désigne précisément la haine ou les préjugés contre les Juifs ?",a:"L'antisémitisme."},
{c:0,n:33,q:"Quel texte est considéré comme le texte fondateur de la laïcité ?",a:"La loi du 9 décembre 1905 sur la séparation des Églises et de l'État."},
{c:0,n:34,q:"Quelle institution française doit rester neutre en matière de religion ?",a:"L'État et tous les services publics."},
{c:0,n:35,q:"Qu'est-ce que la laïcité ?",a:"Le principe de séparation des religions et de l'État, garantissant la liberté de conscience et l'égalité de tous les citoyens quelle que soit leur croyance."},
{c:0,n:36,q:"À l'école, la charte de la laïcité permet de :",a:"Rappeler les règles de la laïcité et du vivre ensemble aux élèves, parents et personnels."},
{c:0,n:37,q:"Qui doit respecter et veiller à la neutralité religieuse dans les services publics ?",a:"Les agents du service public (fonctionnaires)."},
{c:0,n:38,q:"Une personne déclare ne croire en aucun dieu. On peut dire :",a:"Qu'elle est athée."},
{c:1,n:39,q:"Comment est désigné le Premier ministre ?",a:"Il est nommé par le Président de la République."},
{c:1,n:40,q:"Qui peut se présenter aux élections présidentielles ?",a:"Tout citoyen français âgé d'au moins 18 ans, jouissant de ses droits civiques et ayant obtenu 500 parrainages d'élus."},
{c:1,n:41,q:"À qui appartient la souveraineté nationale ?",a:"Au peuple français."},
{c:1,n:42,q:"Qui est élu lors des élections municipales ?",a:"Les conseillers municipaux, qui élisent ensuite le maire."},
{c:1,n:43,q:"L'inscription sur les listes électorales est :",a:"Obligatoire pour pouvoir voter (et automatique à 18 ans depuis 1997)."},
{c:1,n:44,q:"Quelle condition est nécessaire pour voter aux élections présidentielles ?",a:"Être citoyen français, avoir 18 ans révolus, jouir de ses droits civiques et être inscrit sur les listes électorales."},
{c:1,n:45,q:"Quelle condition faut-il remplir pour être candidat aux élections municipales ?",a:"Avoir 18 ans révolus et être inscrit sur les listes électorales de la commune (ou y payer des impôts locaux)."},
{c:1,n:46,q:"Parmi ces autorités, laquelle est élue ?",a:"Le Président de la République (élu au suffrage universel direct)."},
{c:1,n:47,q:"Quelles sont les fonctions du maire ?",a:"Officier d'état civil, représentant de l'État dans la commune, chef de l'administration communale (gestion des écoles, urbanisme, etc.)."},
{c:1,n:48,q:"Une personne, n'ayant pas d'accès à internet, veut s'inscrire sur les listes électorales. Où peut-elle s'inscrire ?",a:"À la mairie de son domicile."},
{c:1,n:49,q:"À quel âge peut-on devenir électeur ?",a:"À 18 ans."},
{c:1,n:50,q:"En France, est-ce obligatoire de voter ?",a:"Non, le vote n'est pas obligatoire mais c'est un devoir civique."},
{c:1,n:51,q:"A-t-on le droit de ne pas respecter une loi ?",a:"Non, nul n'est censé ignorer la loi. Toute personne doit respecter les lois en vigueur."},
{c:1,n:52,q:"Comment sont désignés les députés ?",a:"Ils sont élus au suffrage universel direct pour 5 ans."},
{c:1,n:53,q:"Qui vote les lois ?",a:"Le Parlement (l'Assemblée nationale et le Sénat)."},
{c:1,n:54,q:"La séparation des pouvoirs est un principe fondamental. Quels sont les trois pouvoirs concernés ?",a:"Le pouvoir législatif (faire les lois), le pouvoir exécutif (appliquer les lois) et le pouvoir judiciaire (juger et sanctionner)."},
{c:1,n:55,q:"Qu'est-ce que l'État de droit ?",a:"Un système dans lequel l'État et les citoyens sont soumis aux mêmes lois, et où les droits fondamentaux sont garantis."},
{c:1,n:56,q:"Quelles sont les durées du mandat du conseil municipal et du maire ?",a:"6 ans."},
{c:1,n:57,q:"Qui est élu lors des élections législatives ?",a:"Les députés."},
{c:1,n:58,q:"Quelle est la durée du mandat du Président de la République française ?",a:"5 ans (quinquennat)."},
{c:1,n:59,q:"Quelle est la durée du mandat des députés ?",a:"5 ans."},
{c:1,n:60,q:"Quelle est la durée du mandat des sénateurs ?",a:"6 ans."},
{c:1,n:61,q:"Qui dirige l'action du gouvernement ?",a:"Le Premier ministre."},
{c:1,n:62,q:"En France, est-ce possible d'adhérer à un parti politique ?",a:"Oui, c'est un droit garanti par la Constitution."},
{c:1,n:63,q:"Qui sanctionne l'auteur d'un vol ?",a:"La justice (un tribunal)."},
{c:1,n:64,q:"Qui gère les collèges publics ?",a:"Le département (conseil départemental)."},
{c:1,n:65,q:"Qui gère les écoles primaires et maternelles publiques ?",a:"La commune (la mairie)."},
{c:1,n:66,q:"Comment sont désignés les maires ?",a:"Ils sont élus par les conseillers municipaux."},
{c:1,n:67,q:"Quelle collectivité territoriale est responsable des transports régionaux ?",a:"La région."},
{c:1,n:68,q:"Quelle est l'une des voies possibles pour modifier la Constitution ?",a:"Le référendum ou le vote du Congrès (réunion de l'Assemblée nationale et du Sénat) à la majorité des 3/5."},
{c:1,n:69,q:"Qui assure l'intérim du président de la République en cas de décès ?",a:"Le président du Sénat."},
{c:1,n:70,q:"Quel est le rôle du Conseil constitutionnel ?",a:"Vérifier la conformité des lois à la Constitution."},
{c:1,n:71,q:"Quelle condition est obligatoire pour se présenter à l'élection présidentielle ?",a:"Avoir la nationalité française, avoir au moins 18 ans et obtenir 500 parrainages d'élus."},
{c:1,n:72,q:"Combien y a-t-il de départements en France ?",a:"101 (96 en métropole et 5 outre-mer)."},
{c:1,n:73,q:"Comment est organisé le découpage administratif de la France ?",a:"En communes, départements et régions."},
{c:1,n:74,q:"Qui représente l'État dans un département ?",a:"Le préfet."},
{c:1,n:75,q:"Quel est le rôle du Président de la République ?",a:"Chef de l'État, garant de la Constitution, chef des armées, il nomme le Premier ministre et peut dissoudre l'Assemblée nationale."},
{c:1,n:76,q:"Quel est le rôle du Premier ministre ?",a:"Il dirige l'action du gouvernement, assure l'exécution des lois et est responsable devant l'Assemblée nationale."},
{c:1,n:77,q:"Quel est le rôle du Défenseur des droits ?",a:"Veiller au respect des droits et libertés des citoyens, notamment face aux administrations. Il peut être saisi par toute personne."},
{c:1,n:78,q:"En quelle année la citoyenneté européenne a-t-elle été créée ?",a:"En 1992 (traité de Maastricht)."},
{c:1,n:79,q:"Quel est le dernier État à avoir intégré l'Union européenne en 2013 ?",a:"La Croatie."},
{c:1,n:80,q:"Qui a composé l'hymne de l'Union européenne ?",a:"Ludwig van Beethoven (l'Ode à la Joie, extrait de la 9e symphonie)."},
{c:1,n:81,q:"Quand est célébrée la journée de l'Europe ?",a:"Le 9 mai."},
{c:1,n:82,q:"Où est le siège de la Banque centrale européenne ?",a:"À Francfort (Allemagne)."},
{c:1,n:83,q:"Où est le siège de la Commission européenne ?",a:"À Bruxelles (Belgique)."},
{c:1,n:84,q:"Qui siège au Parlement européen ?",a:"Les députés européens, élus par les citoyens des États membres."},
{c:1,n:85,q:"Les citoyens de l'Union européenne peuvent-ils voter aux élections locales dans un autre État de l'Union ?",a:"Oui, ils peuvent voter et être éligibles aux élections municipales et européennes dans leur pays de résidence."},
{c:1,n:86,q:"Combien d'États font partie de l'Union européenne au 1er janvier 2025 ?",a:"27 États membres."},
{c:1,n:87,q:"En quelle année le traité de Maastricht a-t-il été signé ?",a:"En 1992."},
{c:1,n:88,q:"Quel traité concerne la construction de l'Union européenne ?",a:"Le traité de Maastricht (1992)."},
{c:1,n:89,q:"Quel État a quitté l'Union européenne en 2020 ?",a:"Le Royaume-Uni (Brexit)."},
{c:1,n:90,q:"Quelle est la devise de l'Union européenne ?",a:"« Unie dans la diversité »."},
{c:1,n:91,q:"Quel est l'hymne de l'Union européenne ?",a:"L'Ode à la Joie de Beethoven."},
{c:1,n:92,q:"De quoi est composé le drapeau européen ?",a:"Un cercle de 12 étoiles dorées sur fond bleu."},
{c:1,n:93,q:"Qui élit les députés européens ?",a:"Les citoyens des États membres de l'Union européenne, au suffrage universel direct."},
{c:1,n:94,q:"Où est le siège du Parlement européen ?",a:"À Strasbourg (France)."},
{c:2,n:95,q:"À quoi sert le droit de grève ?",a:"À permettre aux travailleurs de cesser le travail collectivement pour défendre leurs droits et intérêts professionnels."},
{c:2,n:96,q:"Au nom de quoi l'État justifie-t-il la restriction des droits ?",a:"Au nom de l'ordre public, de la sécurité et de la protection des droits d'autrui."},
{c:2,n:97,q:"Laquelle de ces citations est inscrite dans la Déclaration des Droits de l'Homme et du Citoyen de 1789 ?",a:"« Les hommes naissent et demeurent libres et égaux en droits. »"},
{c:2,n:98,q:"L'article 4 de la DDHC affirme que « la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui ». Qu'est-ce que cela signifie ?",a:"Chacun est libre d'agir à condition de ne pas porter atteinte aux droits des autres."},
{c:2,n:99,q:"Que dit l'article 1er de la Constitution française ?",a:"La France est une République indivisible, laïque, démocratique et sociale, qui assure l'égalité devant la loi de tous les citoyens."},
{c:2,n:100,q:"Que garantit la liberté de la presse ?",a:"Le droit d'informer et d'être informé librement, sans censure préalable."},
{c:2,n:101,q:"Que permet la liberté de circulation ?",a:"Le droit d'aller et venir librement sur le territoire national."},
{c:2,n:102,q:"Que signifie être citoyen d'un État ?",a:"Avoir des droits (vote, protection, libertés) et des devoirs (respect des lois, paiement des impôts, défense du pays)."},
{c:2,n:103,q:"Que sont les droits fondamentaux ?",a:"Les droits essentiels garantis à toute personne (liberté, égalité, sûreté, propriété, résistance à l'oppression)."},
{c:2,n:104,q:"Quel droit protège une personne contre une arrestation arbitraire ?",a:"Le droit à la sûreté (habeas corpus), garanti par la Déclaration des Droits de l'Homme."},
{c:2,n:105,q:"Quel est le texte fondateur établissant les droits et les devoirs de chaque citoyen ?",a:"La Déclaration des Droits de l'Homme et du Citoyen de 1789."},
{c:2,n:106,q:"Quel texte affirme que tous les hommes naissent libres et égaux en droits ?",a:"La Déclaration des Droits de l'Homme et du Citoyen de 1789 (article 1er)."},
{c:2,n:107,q:"Quelle situation est une atteinte à la dignité humaine ?",a:"La torture, l'esclavage, les traitements inhumains ou dégradants."},
{c:2,n:108,q:"Qu'est-ce que la liberté d'expression ?",a:"Le droit d'exprimer librement ses opinions et ses idées, dans les limites fixées par la loi (pas d'incitation à la haine, pas de diffamation)."},
{c:2,n:109,q:"Suite à une interpellation par la police, il est possible de :",a:"Demander un avocat et prévenir un proche."},
{c:2,n:110,q:"Tous les citoyens français ont-ils une religion ?",a:"Non, chacun est libre de croire ou de ne pas croire."},
{c:2,n:111,q:"À quel âge est la majorité numérique en France ?",a:"15 ans (âge à partir duquel un mineur peut s'inscrire seul sur les réseaux sociaux)."},
{c:2,n:112,q:"Dans lequel de ces endroits est-on autorisé à fumer ?",a:"En terrasse (espace ouvert). Il est interdit de fumer dans les lieux publics fermés."},
{c:2,n:113,q:"En France, la conduite sans permis d'une moto est :",a:"Un délit passible de sanctions pénales."},
{c:2,n:114,q:"En quoi consiste le devoir de solidarité ?",a:"Contribuer au financement des charges publiques (impôts, cotisations sociales) pour aider les plus vulnérables."},
{c:2,n:115,q:"Est-ce légal d'être marié à plusieurs personnes en même temps ?",a:"Non, la polygamie est interdite en France."},
{c:2,n:116,q:"Est-ce obligatoire de déclarer ses impôts chaque année en France ?",a:"Oui, c'est une obligation légale."},
{c:2,n:117,q:"Est-il obligatoire de porter secours à une personne en danger ?",a:"Oui, la non-assistance à personne en danger est un délit."},
{c:2,n:118,q:"Être juré d'assises est :",a:"Un devoir civique obligatoire."},
{c:2,n:119,q:"La vente d'alcool en France est interdite aux personnes de moins de :",a:"18 ans."},
{c:2,n:120,q:"Le non-respect du code de la route est :",a:"Une infraction pouvant entraîner une contravention ou un délit."},
{c:2,n:121,q:"Lequel de ces crimes ou délits peut entraîner la privation des droits civils et politiques par un juge ?",a:"Les crimes et délits graves (ex. : corruption, terrorisme, certaines atteintes aux biens ou aux personnes)."},
{c:2,n:122,q:"Pour obtenir une carte d'identité, il faut :",a:"Se rendre en mairie avec les justificatifs nécessaires (photo d'identité, justificatif de domicile, acte de naissance)."},
{c:2,n:123,q:"Pour quel motif peut-on limiter la liberté d'expression ?",a:"Pour protéger l'ordre public, la sécurité nationale, et les droits d'autrui (interdiction de l'incitation à la haine, de la diffamation, etc.)."},
{c:2,n:124,q:"Que doit faire un citoyen s'il est appelé à être juré dans un procès d'assises ?",a:"Il doit s'y rendre, c'est une obligation civique."},
{c:2,n:125,q:"Qui peut être appelé à faire partie d'un jury d'assises en France ?",a:"Tout citoyen français de plus de 23 ans, inscrit sur les listes électorales et jouissant de ses droits civiques."},
{c:2,n:126,q:"Quel est l'âge de la majorité civile en France ?",a:"18 ans."},
{c:2,n:127,q:"Quel est l'un des devoirs principaux d'un citoyen français ?",a:"Respecter les lois, payer ses impôts, participer à la défense du pays et accomplir son devoir de juré."},
{c:2,n:128,q:"Quelle est l'infraction la plus grave ?",a:"Le crime (jugé par la cour d'assises)."},
{c:2,n:129,q:"Qu'est-ce que la citoyenneté numérique ?",a:"L'ensemble des droits et devoirs liés à l'usage d'internet et des outils numériques (respect de la vie privée, lutte contre le cyberharcèlement)."},
{c:2,n:130,q:"Qu'est-ce que le devoir de mémoire ?",a:"L'obligation morale de se souvenir des événements tragiques de l'histoire (guerres, génocides, esclavage) pour qu'ils ne se reproduisent pas."},
{c:2,n:131,q:"Une personne est privée de ses droits civils et politiques pendant 5 ans suite à une condamnation. Pendant 5 ans,…",a:"…elle ne peut pas voter ni se présenter à une élection."},
{c:3,n:132,q:"Parmi ces textes, lequel a été adopté sous Napoléon Ier ?",a:"Le Code civil (1804)."},
{c:3,n:133,q:"Qui a été président de la Ve République ?",a:"Charles de Gaulle, Georges Pompidou, Valéry Giscard d'Estaing, François Mitterrand, Jacques Chirac, Nicolas Sarkozy, François Hollande, Emmanuel Macron."},
{c:3,n:134,q:"Quel est l'objectif des lois scolaires de la IIIe République ?",a:"Rendre l'école gratuite, laïque et obligatoire (lois Jules Ferry, 1881-1882)."},
{c:3,n:135,q:"Que signifie la date du 14 juillet pour les Français ?",a:"La fête nationale, commémorant la prise de la Bastille (1789) et la Fête de la Fédération (1790), symboles de la liberté et de l'unité nationale."},
{c:3,n:136,q:"Pourquoi l'année 1958 est importante pour la France ?",a:"C'est la naissance de la Ve République et l'adoption de la Constitution actuelle, sous l'impulsion du général de Gaulle."},
{c:3,n:137,q:"Lequel de ces pays est un pays fondateur de l'Union européenne ?",a:"La France, l'Allemagne, l'Italie, la Belgique, les Pays-Bas ou le Luxembourg."},
{c:3,n:138,q:"Simone Veil est une figure importante de l'histoire française. Elle a notamment :",a:"Défendu la loi sur l'interruption volontaire de grossesse (IVG) en 1975 et été présidente du Parlement européen. Rescapée de la Shoah."},
{c:3,n:139,q:"Dans quelle région est située une partie des plages du débarquement ?",a:"En Normandie."},
{c:3,n:140,q:"Dans quelle ville les rois de France étaient-ils couronnés ?",a:"À Reims."},
{c:3,n:141,q:"Quel roi de France a été guillotiné pendant la Révolution française ?",a:"Louis XVI (en 1793)."},
{c:3,n:142,q:"En quelle année a débuté la Révolution française ?",a:"En 1789."},
{c:3,n:143,q:"En quelle année Napoléon Ier est-il devenu empereur ?",a:"En 1804."},
{c:3,n:144,q:"Lequel de ces personnages a un lien avec la République française ?",a:"De Gaulle, Jean Moulin, Marianne, Victor Hugo, etc."},
{c:3,n:145,q:"De quand date l'appel à la résistance du général de Gaulle ?",a:"Le 18 juin 1940."},
{c:3,n:146,q:"Qu'est-ce que la Shoah ?",a:"Le génocide des Juifs d'Europe par les nazis pendant la Seconde Guerre mondiale (environ 6 millions de victimes)."},
{c:3,n:147,q:"Quel pays a été une colonie française ?",a:"L'Algérie, le Sénégal, Madagascar, le Vietnam, entre autres."},
{c:3,n:148,q:"Qui a rendu l'école gratuite, laïque et obligatoire ?",a:"Jules Ferry (lois de 1881-1882)."},
{c:3,n:149,q:"Depuis quand les Français élisent-ils le président de la République au suffrage universel direct ?",a:"Depuis 1962 (réforme constitutionnelle par référendum sous de Gaulle)."},
{c:3,n:150,q:"En quelle année l'Union européenne a-t-elle été fondée ?",a:"En 1992 (traité de Maastricht), mais la construction européenne a commencé en 1951 avec la CECA."},
{c:3,n:151,q:"Quand a eu lieu la Seconde Guerre mondiale ?",a:"De 1939 à 1945."},
{c:3,n:152,q:"Quand a eu lieu la Première Guerre mondiale ?",a:"De 1914 à 1918."},
{c:3,n:153,q:"Sous quel président a été abolie la peine de mort en France ?",a:"Sous François Mitterrand, en 1981 (loi portée par Robert Badinter)."},
{c:3,n:154,q:"Que célèbre-t-on le 8 mai ?",a:"La victoire des Alliés et la fin de la Seconde Guerre mondiale en Europe (8 mai 1945)."},
{c:3,n:155,q:"Quelle est la première étape de la construction européenne en 1951 ?",a:"La création de la CECA (Communauté Européenne du Charbon et de l'Acier)."},
{c:3,n:156,q:"Qui était une figure de la Résistance française pendant la Seconde Guerre mondiale ?",a:"Jean Moulin."},
{c:3,n:157,q:"Le 11 novembre est un jour férié. À quoi correspond cette date ?",a:"L'armistice de la Première Guerre mondiale (11 novembre 1918)."},
{c:3,n:158,q:"Depuis quand l'esclavage a-t-il été aboli en France ?",a:"Définitivement en 1848 (décret du 27 avril 1848)."},
{c:3,n:159,q:"Qui a aboli l'esclavage en France ?",a:"Victor Schœlcher, en 1848."},
{c:3,n:160,q:"Depuis quelle année l'école publique est-elle gratuite ?",a:"Depuis 1881 (lois Jules Ferry)."},
{c:3,n:161,q:"En 1944, qu'est-ce qui a changé pour les femmes ?",a:"Elles ont obtenu le droit de vote (ordonnance du 21 avril 1944)."},
{c:3,n:162,q:"Quelle organisation a été créée en 1945 après la Seconde Guerre mondiale ?",a:"L'Organisation des Nations Unies (ONU)."},
{c:3,n:163,q:"En quelle année l'euro est-il devenu la monnaie officielle de la France ?",a:"En 2002 (mise en circulation des pièces et billets)."},
{c:3,n:164,q:"Lors de la Seconde Guerre mondiale, à quelle date la ville de Paris a-t-elle été libérée ?",a:"Le 25 août 1944."},
{c:3,n:165,q:"Quel était le principal port français impliqué dans la traite négrière au XVIIIe siècle ?",a:"Nantes."},
{c:3,n:166,q:"Quel célèbre philosophe des Lumières a dénoncé l'esclavage ?",a:"Voltaire (et aussi Montesquieu, Condorcet, Diderot)."},
{c:3,n:167,q:"Quelle œuvre a été écrite par Victor Hugo ?",a:"Les Misérables, Notre-Dame de Paris, entre autres."},
{c:3,n:168,q:"Quel peintre est français ?",a:"Claude Monet, Paul Cézanne, Auguste Renoir, Eugène Delacroix, entre autres."},
{c:3,n:169,q:"Quel plat est une spécialité de la cuisine française ?",a:"Le bœuf bourguignon, la blanquette de veau, le coq au vin, la ratatouille, etc."},
{c:3,n:170,q:"Qui était Marie Curie ?",a:"Une physicienne et chimiste franco-polonaise, double prix Nobel (physique en 1903 et chimie en 1911), pionnière de la radioactivité."},
{c:3,n:171,q:"Qui a peint « La liberté guidant le peuple » ?",a:"Eugène Delacroix (1830)."},
{c:3,n:172,q:"Dans quel grand musée parisien est exposée la Joconde ?",a:"Au musée du Louvre."},
{c:3,n:173,q:"Quel château célèbre se trouve près de Paris et symbolise le pouvoir royal de Louis XIV ?",a:"Le château de Versailles."},
{c:3,n:174,q:"Où peut-on voir des peintures préhistoriques en France ?",a:"Dans la grotte de Lascaux (Dordogne)."},
{c:3,n:175,q:"Quel peintre célèbre a peint les Nymphéas ?",a:"Claude Monet."},
{c:3,n:176,q:"Pendant quelles journées peut-on visiter gratuitement des lieux culturels en France ?",a:"Les Journées européennes du patrimoine (en septembre)."},
{c:3,n:177,q:"Que symbolise le 1er mai ?",a:"La Fête du Travail."},
{c:3,n:178,q:"Qui était Monsieur Rouget de Lisle ?",a:"L'auteur de la Marseillaise (l'hymne national français), composée en 1792."},
{c:3,n:179,q:"À quelle occasion a été construite la Tour Eiffel ?",a:"Pour l'Exposition universelle de 1889, célébrant le centenaire de la Révolution française."},
{c:3,n:180,q:"Quelle chaîne de montagnes est située entre la France et l'Italie ?",a:"Les Alpes."},
{c:3,n:181,q:"Qui était Molière ?",a:"Un dramaturge et comédien du XVIIe siècle, auteur de comédies célèbres (Le Misanthrope, Tartuffe, L'Avare)."},
{c:3,n:182,q:"Qui était Charles Baudelaire ?",a:"Un poète du XIXe siècle, auteur des Fleurs du mal."},
{c:3,n:183,q:"Qui était George Sand ?",a:"Une romancière du XIXe siècle (de son vrai nom Amantine Lucile Aurore Dupin), pionnière du féminisme."},
{c:3,n:184,q:"Qui était Simone de Beauvoir ?",a:"Une philosophe, écrivaine et féministe du XXe siècle, auteure du Deuxième Sexe."},
{c:3,n:185,q:"Qui était Albert Camus ?",a:"Un écrivain et philosophe du XXe siècle, prix Nobel de littérature (1957), auteur de L'Étranger et La Peste."},
{c:3,n:186,q:"Qui était Marguerite Yourcenar ?",a:"Une écrivaine du XXe siècle, première femme élue à l'Académie française (1980), auteure des Mémoires d'Hadrien."},
{c:3,n:187,q:"Qui était Paul Cézanne ?",a:"Un peintre post-impressionniste du XIXe siècle, considéré comme le père de l'art moderne."},
{c:3,n:188,q:"Qui était Auguste Rodin ?",a:"Un sculpteur du XIXe siècle, auteur du Penseur et des Bourgeois de Calais."},
{c:3,n:189,q:"Qui était un célèbre compositeur français ?",a:"Claude Debussy, Maurice Ravel, Hector Berlioz, Camille Saint-Saëns, entre autres."},
{c:3,n:190,q:"Qui était Auguste Renoir ?",a:"Un peintre impressionniste du XIXe siècle, célèbre pour ses scènes de la vie quotidienne."},
{c:3,n:191,q:"Quel musée est situé à Paris ?",a:"Le Louvre, le musée d'Orsay, le Centre Pompidou, entre autres."},
{c:3,n:192,q:"Quel monument historique se trouve sur une île en Normandie ?",a:"Le Mont-Saint-Michel."},
{c:3,n:193,q:"Quelle ville française fait partie des 10 plus grandes métropoles du pays ?",a:"Lyon, Marseille, Toulouse, Lille, Bordeaux, Nice, Nantes, Strasbourg, entre autres."},
{c:3,n:194,q:"Quelle île fait partie des Antilles françaises ?",a:"La Guadeloupe ou la Martinique."},
{c:3,n:195,q:"Quelle île est française ?",a:"La Corse, La Réunion, la Guadeloupe, la Martinique, Mayotte, la Nouvelle-Calédonie, etc."},
{c:3,n:196,q:"Quelle est la plus haute montagne de France ?",a:"Le Mont Blanc (4 808 m)."},
{c:3,n:197,q:"Quelle île française est située dans l'océan Indien ?",a:"La Réunion (et Mayotte)."},
{c:3,n:198,q:"Quel département français a une frontière avec le Brésil ?",a:"La Guyane."},
{c:3,n:199,q:"De quelle ville française décolle la fusée Ariane ?",a:"De Kourou (en Guyane)."},
{c:3,n:200,q:"Quelle mer ou océan borde la France métropolitaine ?",a:"L'océan Atlantique, la Manche, la mer du Nord et la mer Méditerranée."},
{c:3,n:201,q:"Quelle mer se situe entre la France et l'Angleterre ?",a:"La Manche."},
{c:3,n:202,q:"Quelle île est un département d'outre-mer français ?",a:"La Réunion, la Guadeloupe, la Martinique, Mayotte ou la Guyane (qui n'est pas une île mais un DROM)."},
{c:3,n:203,q:"Qu'est-ce que la France d'outre-mer ?",a:"L'ensemble des territoires français situés en dehors de la métropole (DROM-COM : La Réunion, Guadeloupe, Martinique, Guyane, Mayotte, Polynésie française, Nouvelle-Calédonie, etc.)."},
{c:3,n:204,q:"Quelle est la population approximative de la France en 2025 ?",a:"Environ 68 millions d'habitants."},
{c:3,n:205,q:"Quel est le principal port maritime de France ?",a:"Marseille."},
{c:3,n:206,q:"Combien y a-t-il de régions en France métropolitaine ?",a:"13 régions."},
{c:3,n:207,q:"Quelle chaîne de montagnes est située entre la France et l'Espagne ?",a:"Les Pyrénées."},
{c:3,n:208,q:"Quelle île française se trouve au sud-est du continent africain ?",a:"La Réunion (et Madagascar fut un territoire français)."},
{c:3,n:209,q:"Quel est le chef-lieu de la région Auvergne-Rhône-Alpes ?",a:"Lyon."},
{c:3,n:210,q:"Quel est le chef-lieu de la région Bretagne ?",a:"Rennes."},
{c:3,n:211,q:"Quel est le chef-lieu de la région Provence-Alpes-Côte d'Azur ?",a:"Marseille."},
{c:3,n:212,q:"Quel est le 101e département français depuis 2011 ?",a:"Mayotte."},
{c:3,n:213,q:"Quelle région française est réputée pour ses stations de ski ?",a:"Auvergne-Rhône-Alpes (les Alpes)."},
{c:3,n:214,q:"Quel fleuve traverse Paris ?",a:"La Seine."},
{c:4,n:215,q:"Où faut-il déclarer la naissance d'un enfant ?",a:"À la mairie du lieu de naissance, dans les 5 jours suivant l'accouchement."},
{c:4,n:216,q:"Quelle action peut réaliser le locataire d'un logement sans l'autorisation du propriétaire ?",a:"Peindre les murs ou effectuer de petits travaux de décoration non structurels."},
{c:4,n:217,q:"Quel mariage est reconnu légalement ?",a:"Le mariage civil (célébré à la mairie). Le mariage religieux seul n'a pas de valeur légale."},
{c:4,n:218,q:"Le stationnement sur une place réservée aux personnes handicapées :",a:"Est interdit et passible d'une amende (sauf pour les titulaires d'une carte de stationnement handicapé)."},
{c:4,n:219,q:"Si une machine à laver est cassée, il est possible de :",a:"La faire réparer ou la déposer dans une déchetterie / un point de collecte pour le recyclage."},
{c:4,n:220,q:"Dans quel cas faut-il déclarer son enfant au service d'état civil ?",a:"À chaque naissance."},
{c:4,n:221,q:"Quand faut-il déclarer son enfant au service d'état civil ?",a:"Dans les 5 jours suivant la naissance."},
{c:4,n:222,q:"Quel numéro d'urgence permet d'appeler la police ?",a:"Le 17."},
{c:4,n:223,q:"Quel numéro d'urgence permet d'appeler le SAMU ?",a:"Le 15."},
{c:4,n:224,q:"Auprès de quelle institution les parents peuvent inscrire leurs enfants à l'école publique ?",a:"La mairie de leur commune."},
{c:4,n:225,q:"En cas de divorce, qui exerce l'autorité parentale ?",a:"En principe, les deux parents conjointement (sauf décision contraire du juge)."},
{c:4,n:226,q:"Quelle aide permet aux personnes qui ont des difficultés financières d'avoir un avocat ?",a:"L'aide juridictionnelle."},
{c:4,n:227,q:"Qui peut demander le divorce de personnes mariées ?",a:"L'un ou les deux époux."},
{c:4,n:228,q:"Auprès de quel organisme faut-il demander le remboursement des frais de santé ?",a:"La Caisse Primaire d'Assurance Maladie (CPAM) / la Sécurité sociale."},
{c:4,n:229,q:"La contraception :",a:"Est légale et accessible en France."},
{c:4,n:230,q:"Qu'est-ce que le principe de confidentialité dans le domaine de la santé ?",a:"Le secret médical : un professionnel de santé ne peut pas divulguer d'informations sur l'état de santé d'un patient sans son accord."},
{c:4,n:231,q:"À quoi sert la carte Vitale ?",a:"À attester de l'affiliation à la Sécurité sociale et à permettre le remboursement des frais de santé."},
{c:4,n:232,q:"À quoi sert une mutuelle santé ?",a:"À compléter les remboursements de la Sécurité sociale pour réduire le reste à charge du patient."},
{c:4,n:233,q:"Qu'est-ce que le tiers payant ?",a:"Un dispositif qui dispense le patient de l'avance des frais médicaux."},
{c:4,n:234,q:"L'inscription à l'Assurance maladie est :",a:"Obligatoire pour toute personne résidant en France de manière stable et régulière."},
{c:4,n:235,q:"L'avortement est-il possible en France ?",a:"Oui, l'IVG est légale et peut être pratiquée jusqu'à 14 semaines de grossesse."},
{c:4,n:236,q:"Travailler sans être déclaré est :",a:"Illégal (travail dissimulé, passible de sanctions pénales)."},
{c:4,n:237,q:"Qu'est-ce que le SMIC ?",a:"Le Salaire Minimum Interprofessionnel de Croissance, c'est-à-dire le salaire horaire minimum légal en France."},
{c:4,n:238,q:"Quelle est la première démarche à réaliser pour chercher un emploi ?",a:"S'inscrire à France Travail (anciennement Pôle emploi)."},
{c:4,n:239,q:"Quelle est la durée légale du temps de travail par semaine ?",a:"35 heures."},
{c:4,n:240,q:"Qui peut demander un congé parental d'éducation ?",a:"Le père ou la mère, sans distinction."},
{c:4,n:241,q:"Une personne étrangère, en situation régulière, peut créer son entreprise :",a:"Oui, elle en a le droit en France."},
{c:4,n:242,q:"Une femme peut-elle créer son entreprise ?",a:"Oui, au même titre qu'un homme."},
{c:4,n:243,q:"Quels sont les textes qui définissent les règles au travail ?",a:"Le Code du travail et les conventions collectives."},
{c:4,n:244,q:"Quelles sont les affaires traitées par le conseil de prud'hommes ?",a:"Les litiges entre employeurs et salariés liés au contrat de travail."},
{c:4,n:245,q:"Qui a le droit de se syndiquer ?",a:"Tout salarié, sans condition de nationalité."},
{c:4,n:246,q:"Est-il possible de licencier une femme enceinte ou en congé maternité, en raison de sa grossesse ?",a:"Non, c'est interdit par la loi (discrimination)."},
{c:4,n:247,q:"L'instruction des enfants est obligatoire de :",a:"3 à 16 ans."},
{c:4,n:248,q:"Des parents ne respectent pas l'obligation d'instruction pour leurs enfants. Quelle sanction maximale risquent-ils ?",a:"Jusqu'à 6 mois d'emprisonnement et 7 500 € d'amende."},
{c:4,n:249,q:"Quelle est la définition de l'autorité parentale ?",a:"L'ensemble des droits et devoirs des parents envers leur enfant mineur, pour assurer sa protection, son éducation et son bien-être."},
{c:4,n:250,q:"Quel motif d'absence est accepté par l'école ?",a:"Maladie de l'enfant, décès d'un proche, fête religieuse, convocation officielle."},
{c:4,n:251,q:"Jusqu'à quel âge l'école est-elle obligatoire ?",a:"Jusqu'à 16 ans (l'instruction, pas nécessairement la scolarisation)."},
{c:4,n:252,q:"À quel âge commence l'instruction obligatoire des enfants ?",a:"À 3 ans."},
{c:4,n:253,q:"Comment s'appellent les établissements scolaires que les élèves intègrent après l'école élémentaire ?",a:"Les collèges."},
{c:4,n:254,q:"En tant que parent d'élève, il est possible de :",a:"Participer aux conseils d'école ou de classe et voter pour les représentants de parents d'élèves."},
{c:4,n:255,q:"Quelle instruction est prévue pour les enfants qui ne parlent pas français ?",a:"Ils sont accueillis dans des classes spécifiques (UPE2A) pour apprendre le français."},
{c:4,n:256,q:"S'agissant de l'accueil des enfants en situation de handicap à l'école, laquelle des propositions est vraie ?",a:"Tout enfant en situation de handicap a le droit d'être inscrit dans l'école la plus proche de son domicile (principe d'inclusion scolaire)."},
{c:4,n:257,q:"Depuis le 1er juillet 2021, quelle est la durée du congé paternité ?",a:"25 jours (ou 32 jours en cas de naissance multiple)."},
{c:4,n:258,q:"Est-ce possible de punir physiquement ses enfants ?",a:"Non, les violences physiques et les châtiments corporels sont interdits (loi de 2019)."}

/* ---------- état ---------- */
const CLE = "civique:progression";
let etats = {};          // { numéro: "su" | "revoir" }
let rubrique = -1;       // -1 = toutes
let deck = [];
let pos = 0;
let ouvert = false;
let mode = "fiche";       // "fiche" | "qcm"
let options = null;       // propositions mélangées de la carte affichée
let carteRendue = null;   // numéro de la carte pour laquelle options a été tiré
let choix = null;         // index choisi dans options
let serie = {justes:0, total:0};

const $ = id => document.getElementById(id);

async function charger(){
  try{
    const r = await window.storage.get(CLE);
    if(r && r.value) etats = JSON.parse(r.value);
  }catch(e){ etats = {}; }
}
async function sauver(){
  try{ await window.storage.set(CLE, JSON.stringify(etats)); }catch(e){}
}

/* ---------- constitution du paquet ---------- */
function melanger(t){
  for(let i=t.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[t[i],t[j]]=[t[j],t[i]];}
  return t;
}
function construire(garder){
  const nActuel = garder && deck[pos] !== undefined ? FICHES[deck[pos]].n : null;
  const seulRevoir = $("f-revoir").checked;
  const seulNeuves = $("f-neuves").checked;
  deck = [];
  FICHES.forEach((f,i)=>{
    if(rubrique !== -1 && f.c !== rubrique) return;
    const e = etats[f.n];
    if(seulRevoir && e !== "revoir") return;
    if(seulNeuves && e) return;
    deck.push(i);
  });
  if($("f-melange").checked) melanger(deck);
  const retrouve = nActuel === null ? -1 : deck.findIndex(i => FICHES[i].n === nActuel);
  pos = retrouve >= 0 ? retrouve : Math.min(pos, Math.max(deck.length-1,0));
  reinitCarte();
  dessiner();
}

/* ---------- rendu ---------- */
function dessinerModes(){
  const hote = $("modes");
  hote.innerHTML = "";
  [["Fiches à retourner","fiche"],["Questions à choix multiples","qcm"]].forEach(([t,v])=>{
    const b = document.createElement("button");
    b.innerHTML = '<span>'+t+'</span>';
    b.setAttribute("aria-pressed", v === mode);
    b.onclick = ()=>{ mode = v; serie = {justes:0,total:0}; reinitCarte(); dessinerModes(); dessiner(); };
    hote.appendChild(b);
  });
}
function reinitCarte(){ ouvert = false; choix = null; options = null; carteRendue = null; }

function dessinerRubriques(){
  const hote = $("rubriques");
  hote.innerHTML = "";
  const lignes = [{t:"Toutes les questions", v:-1, n:FICHES.length}]
    .concat(RUBRIQUES.map((t,i)=>({t, v:i, n:FICHES.filter(f=>f.c===i).length})));
  lignes.forEach(l=>{
    const b = document.createElement("button");
    b.innerHTML = '<span>'+l.t+'</span><span class="n">'+l.n+'</span>';
    b.setAttribute("aria-pressed", l.v === rubrique);
    b.onclick = ()=>{ rubrique = l.v; pos = 0; dessinerRubriques(); construire(false); };
    hote.appendChild(b);
  });
}

function dessiner(){
  const fiche = $("fiche"), actions = $("actions");
  const total = FICHES.length;
  const acquis = FICHES.filter(f=>etats[f.n]==="su").length;
  const aRevoir = FICHES.filter(f=>etats[f.n]==="revoir").length;

  $("jauge").style.width = (acquis/total*100)+"%";
  $("compte").innerHTML = "<b>"+acquis+"</b> / "+total+" acquises<br>"+aRevoir+" à revoir · "+(total-acquis-aRevoir)+" jamais vues";

  if(deck.length === 0){
    $("rubrique-en-cours").textContent = "";
    $("position").textContent = "";
    fiche.innerHTML = '<p class="vide">Aucune question ne correspond à cette sélection. Décochez un filtre ou choisissez une autre rubrique.</p>';
    actions.innerHTML = "";
    $("prec").disabled = $("suiv").disabled = true;
    return;
  }
  $("prec").disabled = $("suiv").disabled = false;

  const f = FICHES[deck[pos]];
  const e = etats[f.n];
  $("rubrique-en-cours").textContent = RUBRIQUES[f.c] +
    (mode === "qcm" && serie.total ? "  ·  " + serie.justes + " sur " + serie.total + " justes" : "");
  $("position").textContent = (pos+1)+" sur "+deck.length;
  $("aide").innerHTML = mode === "qcm"
    ? '<kbd>1</kbd>–<kbd>4</kbd> répondre · <kbd>espace</kbd> suivante'
    : '<kbd>espace</kbd> révéler · <kbd>1</kbd> à revoir · <kbd>2</kbd> je savais';

  const badge = e === "su" ? '<span class="etat su">acquise</span>'
              : e === "revoir" ? '<span class="etat revoir">à revoir</span>' : '<span></span>';
  fiche.innerHTML =
    '<div class="num"><span>Question '+f.n+'</span>'+badge+'</div>'+
    '<p class="question">'+f.q+'</p>'+
    (ouvert && mode === "fiche" ? '<div class="reponse apparait">'+f.a+'</div>' : '');

  actions.innerHTML = "";

  if(mode === "qcm"){
    if(carteRendue !== f.n){ options = tirerOptions(f); carteRendue = f.n; choix = null; }
    const liste = document.createElement("div");
    liste.className = "propositions";
    options.forEach((o,i)=>{
      const b = document.createElement("button");
      b.className = "prop";
      b.innerHTML = '<span class="lettre">'+"ABCD"[i]+'</span><span>'+o.t+'</span>';
      if(choix !== null){
        b.disabled = true;
        if(o.juste) b.classList.add("juste");
        else if(i === choix) b.classList.add("faux");
      }else{
        b.onclick = ()=>repondre(i);
      }
      liste.appendChild(b);
    });
    fiche.appendChild(liste);
    if(choix !== null){
      const juste = options[choix].juste;
      const v = document.createElement("p");
      v.className = "verdict " + (juste ? "ok" : "ko");
      v.textContent = juste ? "Bonne réponse." : "Réponse incorrecte.";
      fiche.appendChild(v);
      const r = document.createElement("div");
      r.className = "reponse apparait";
      r.textContent = f.a;
      fiche.appendChild(r);
      actions.appendChild(bouton("Question suivante","btn principal",()=>aller(1)));
    }
    return;
  }

  if(!ouvert){
    actions.appendChild(bouton("Afficher la réponse","btn principal",()=>{ouvert=true;dessiner();}));
  }else{
    actions.appendChild(bouton("À revoir","btn revoir",()=>noter("revoir")));
    actions.appendChild(bouton("Je savais","btn su",()=>noter("su")));
  }
}

function tirerOptions(f){
  const q = QCM[f.n];
  const t = [{t:q.v,juste:true}].concat(q.d.map(x=>({t:x,juste:false})));
  return melanger(t);
}
function repondre(i){
  if(choix !== null) return;
  choix = i;
  const f = FICHES[deck[pos]];
  const juste = options[i].juste;
  serie.total++; if(juste) serie.justes++;
  etats[f.n] = juste ? "su" : "revoir";
  sauver();
  dessiner();
}
function bouton(txt,cls,fn){
  const b=document.createElement("button"); b.className=cls; b.textContent=txt; b.onclick=fn; return b;
}

function noter(v){
  if(deck.length===0) return;
  const f = FICHES[deck[pos]];
  etats[f.n] = v;
  sauver();
  const filtre = $("f-revoir").checked || $("f-neuves").checked;
  if(filtre){
    deck.splice(pos,1);
    if(pos >= deck.length) pos = 0;
    reinitCarte();
    dessiner();
  }else{
    aller(1);
  }
}
function aller(d){
  if(deck.length===0) return;
  pos = (pos + d + deck.length) % deck.length;
  reinitCarte();
  dessiner();
}

/* ---------- recherche ---------- */
function chercher(){
  const t = $("q").value.trim().toLowerCase();
  const res = $("res");
  res.innerHTML = "";
  if(t.length < 2) return;
  const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const cible = norm(t);
  FICHES.filter(f => norm(f.q).includes(cible) || norm(f.a).includes(cible))
        .slice(0,10)
        .forEach(f=>{
          const b=document.createElement("button");
          b.innerHTML='<span class="r-num">'+f.n+'</span>'+f.q;
          b.onclick=()=>{
            rubrique = -1;
            $("f-revoir").checked = $("f-neuves").checked = false;
            dessinerRubriques();
            reinitCarte();
            construire(false);
            const i = deck.findIndex(k => FICHES[k].n === f.n);
            if(i>=0){ pos = i; ouvert = true; dessiner(); }
            $("q").value=""; res.innerHTML="";
          };
          res.appendChild(b);
        });
}

/* ---------- branchements ---------- */
$("prec").onclick = ()=>aller(-1);
$("suiv").onclick = ()=>aller(1);
["f-revoir","f-neuves","f-melange"].forEach(id => $(id).onchange = ()=>{ pos=0; construire(false); });
$("q").oninput = chercher;
$("q").onblur = ()=> setTimeout(()=>{$("res").innerHTML="";}, 180);
$("raz").onclick = ()=>{
  etats = {}; sauver(); construire(true);
};

document.addEventListener("keydown", ev=>{
  if(ev.target.tagName === "INPUT") return;
  if(ev.key === "ArrowRight"){ aller(1); return; }
  if(ev.key === "ArrowLeft"){ aller(-1); return; }
  if(mode === "qcm"){
    if("1234".includes(ev.key) && choix === null && options) repondre(Number(ev.key)-1);
    else if((ev.key === " " || ev.key === "Enter") && choix !== null){ ev.preventDefault(); aller(1); }
    return;
  }
  if(ev.key === " " || ev.key === "Enter"){ ev.preventDefault(); if(!ouvert){ouvert=true;dessiner();} }
  else if(ev.key === "1" && ouvert) noter("revoir");
  else if(ev.key === "2" && ouvert) noter("su");
});

/* ---------- démarrage ---------- */
(async function(){
  await charger();
  dessinerModes();
  dessinerRubriques();
  construire(false);
})();
</script>
